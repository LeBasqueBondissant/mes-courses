<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f6f7">
<meta name="description" content="Ma liste de courses personnelle, mes magasins et mes habitudes.">
<title>Mes courses — V1.3</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#182331;background:#f3f6f7;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.48;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8bdad0;outline-offset:2px}
.shell{max-width:860px;margin:auto;padding:18px 18px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 19px}
h1{font-size:clamp(27px,5vw,35px);line-height:1.1;letter-spacing:-1px;margin:0;font-weight:780;color:#163036}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.3px;color:#16756c;margin:0 0 8px;text-transform:uppercase}
.sub{font-size:13px;color:#5b6d73;margin:6px 0 0}
.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#d9f3eb;font-size:23px;flex:none}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#eaf0f0;padding:5px;border-radius:16px;margin-bottom:18px}
nav button{border:0;border-radius:12px;padding:11px 4px;background:transparent;color:#50666b;font-size:13px;font-weight:750;min-width:0}
nav button.active{background:#fff;color:#0f5955;box-shadow:0 2px 6px #183f3e14}
.card{background:#fff;border:1px solid #e4ebed;border-radius:20px;padding:19px;margin:0 0 14px;box-shadow:0 4px 16px #133b3610}
.card h2{font-size:18px;line-height:1.28;letter-spacing:-.25px;margin:0 0 12px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-heading h2{margin:0}
.muted{color:#65777c}
.micro{font-size:12px;color:#66777e;line-height:1.42}
.small{font-size:13px;line-height:1.5;color:#5c7075}
label.field{display:block;font-size:12px;font-weight:700;color:#53656a;margin-bottom:6px}
.add-grid{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:end}
.field-input{width:100%;min-height:44px;border-radius:11px;border:1px solid #cfdde0;background:#fff;padding:11px 12px;color:#182331}
.primary{border:0;border-radius:11px;padding:12px 16px;min-height:44px;background:#146c65;color:white;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.primary:hover{background:#0f5852}
.secondary{border:1px solid #cbd9dc;border-radius:11px;padding:10px 12px;min-height:40px;background:#fff;color:#235d5a;font-weight:700}
.ghost{background:#edf6f3;color:#0e665d;border:0;border-radius:10px;padding:9px 11px;font-weight:700}
.destructive{color:#ae3838;background:#fff;border:1px solid #ebcaca;border-radius:10px;padding:9px 11px;font-weight:700}
.icon-btn{background:transparent;border:0;border-radius:9px;padding:8px;min-width:37px;min-height:37px;font-size:18px;color:#59727a}
.icon-btn:hover{background:#f2f7f6}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid #bcd9d4;color:#125f58;border-radius:999px;background:#f1fbf8;padding:9px 12px;font-size:13px;font-weight:650}
.empty{padding:16px;border:1px dashed #ccd9d9;background:#f8faf9;border-radius:13px;color:#67777b;font-size:13px;line-height:1.6}
.group-title{font-size:13px;letter-spacing:.2px;color:#516a70;font-weight:800;margin:18px 0 6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #edf1f1;min-height:54px}
.item:first-of-type{border-top:0}
.item-body{min-width:0;flex:1}
.item-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.item-sub{font-size:12px;color:#6b7b80;margin-top:3px}
.item-actions{display:flex;gap:2px;flex:none;align-items:center}
.pill{display:inline-block;font-size:11px;font-weight:750;padding:4px 8px;border-radius:999px;background:#eff3f4;color:#5a6b72;white-space:nowrap}
.pill-blue{background:#eaf2fd;color:#235b8c}
.pill-green{background:#e9f7f1;color:#0d6a50}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f0f7f4;border-radius:14px;padding:15px}
.stat b{font-size:24px;color:#174e49;display:block}
.stat span{font-size:12px;color:#5e7479}
.hint{background:#eaf6f4;border-left:3px solid #2e9e92;border-radius:8px;padding:11px 13px;color:#315a58;font-size:13px;line-height:1.5;margin-top:13px}
.check{width:24px;height:24px;accent-color:#176f66;flex:none;cursor:pointer}
.checked .item-name{text-decoration:line-through;color:#718184}
.session-head{background:#e7f5ef;border:1px solid #cce7db;border-radius:14px;padding:13px;margin-bottom:14px}
.session-head b{display:block;color:#185c50}
.session-head p{margin:4px 0 0;color:#4b716a;font-size:12px}
.session-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
hr{border:0;border-top:1px solid #e7eeee;margin:18px 0}
.kicker{font-size:12px;font-weight:800;color:#256d64;letter-spacing:.65px;text-transform:uppercase;margin:0 0 5px}
.suggestion{border-top:1px solid #edf1f1;padding:12px 0;display:flex;align-items:center;gap:12px}
.suggestion .primary{min-height:38px;padding:8px 10px;font-size:12px}
.all-other{background:#f8f9f9;border-radius:14px;padding:14px;margin-top:12px}
.all-other .group-title:first-child{margin-top:0}
.note{font-size:12px;color:#6b7d82;margin:5px 0 0}
.list-selector{display:flex;gap:9px;align-items:end}
.list-selector>div{flex:1}
.note-box{padding:12px;border-radius:12px;background:#f7f9fa;font-size:13px;color:#536b72;line-height:1.5}
.history-card{padding:12px 0;border-top:1px solid #edf0f0}
.history-card:first-of-type{border-top:0}
.history-card h3{font-size:14px;margin:0 0 6px}
.history-card p{font-size:13px;line-height:1.6;color:#5e6c70;margin:0}
.modal-backdrop{position:fixed;inset:0;background:#142c33a6;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:100%;max-width:540px;background:#fff;border-radius:20px;padding:22px;max-height:90vh;overflow:auto;box-shadow:0 15px 50px #0003}
.modal h2{margin:0 0 16px;font-size:20px}
.store-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0 18px}
.store-check{padding:9px;background:#f7faf9;border:1px solid #e7eeee;border-radius:9px;font-size:13px;display:flex;gap:8px;align-items:center}
.store-check input{accent-color:#1d7066}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1a3940;color:#fff;border-radius:12px;padding:12px 16px;font-size:13px;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 25px #15312f55;display:none}
.toast.show{display:block}
.footer-note{text-align:center;color:#708286;font-size:11px;margin-top:20px;line-height:1.6}
.settings-row{display:flex;flex-wrap:wrap;gap:9px}
.catalog-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,275px);gap:12px;align-items:end;margin-bottom:12px}
.purchase-count{font-weight:850;color:#155c54;background:#e9f6f1;padding:2px 6px;border-radius:6px;white-space:nowrap}
.last-purchase{color:#64757b}
.catalogue-rayon{background:#f2f7f6;border-radius:7px;padding:9px 11px;margin-top:13px}
@media(max-width:640px){.catalog-controls{grid-template-columns:1fr}.shell{padding:14px 12px 95px}.card{padding:16px;border-radius:17px}.add-grid{grid-template-columns:minmax(0,1fr) 88px}.add-grid .add-button{grid-column:1/-1}.add-button{width:100%}nav button{font-size:11px;padding:12px 2px}.list-selector{display:block}.list-selector button{width:100%;margin-top:8px}.store-grid{grid-template-columns:1fr 1fr}.item-name{font-size:14px}.small{font-size:12px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease}}

/* V1.3: navigation mobile et sessions enrichies */
.nav-icon{margin-right:5px}
.nav-text-mobile{display:none}
.data-settings{display:block}
.data-settings>summary{font-size:18px;font-weight:750;cursor:pointer;list-style:none;display:flex;align-items:center;min-height:30px}
.data-settings>summary::-webkit-details-marker{display:none}
.data-settings>summary::after{content:'+';margin-left:auto;color:#4c706e;font-size:24px;line-height:1}
.data-settings[open]>summary::after{content:'\2212'}
.data-inner{padding-top:12px}
.data-inner>p{margin-top:4px}
@media(max-width:640px){
  :root{scroll-padding-top:12px}
  .shell{padding:10px 10px calc(104px + env(safe-area-inset-bottom,0px));max-width:100%}
  header{margin:0 1px 10px;gap:7px;min-height:48px}
  header .eyebrow,header .sub{display:none}
  h1{font-size:26px;letter-spacing:-.7px;line-height:1.1}
  .logo{width:37px;height:37px;font-size:20px;border-radius:12px}
  nav{position:fixed;z-index:8;bottom:0;left:0;right:0;margin:0;padding:7px 6px calc(8px + env(safe-area-inset-bottom,0px));gap:3px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-top:1px solid #dce7e5;border-radius:0;box-shadow:0 -5px 20px #102d2b14}
  nav button{font-size:11px;line-height:1.2;padding:7px 2px 6px;min-height:52px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
  nav button.active{background:#e9f7f2;box-shadow:none;color:#0d665c}
  .nav-icon{font-size:21px;margin:0;line-height:1.1}
  .nav-text-desktop{display:none}
  .nav-text-mobile{display:block}
  .card{padding:14px 13px;border-radius:17px;margin-bottom:10px;box-shadow:0 2px 12px #133b360a}
  .card h2{font-size:17px;margin-bottom:10px}
  .section-heading{margin-bottom:9px}
  .section-heading h2{margin:0}
  .add-grid{grid-template-columns:minmax(0,1fr) 103px;gap:7px}
  .add-grid .add-button{grid-column:1/-1;margin-top:1px;min-height:43px}
  .field-input{min-height:44px;font-size:16px;padding:9px 10px}
  .field-input::placeholder{font-size:14px}
  .group-title{margin:12px 0 5px;font-size:12px}
  .item{padding:8px 0;min-height:48px}
  .item-name{font-size:15px}
  .item-sub{font-size:11px;line-height:1.45}
  .icon-btn{min-height:40px;min-width:40px}
  .hint.guide,.small.guide,.micro.guide{display:none}
  .empty{padding:12px;font-size:12px;line-height:1.45}
  .all-other{padding:10px;margin-top:10px}
  .all-other .section-heading h2{font-size:15px}
  .session-head{margin-bottom:11px;padding:11px}
  .session-actions{gap:7px;margin-top:11px}
  .session-actions .primary,.session-actions .secondary{flex:1 1 100%}
  .list-selector{display:block}
  .list-selector .primary{width:100%;margin-top:8px}
  .catalog-controls{gap:9px}
  .stat{padding:9px 12px;border-radius:11px}
  .stat b{font-size:19px}
  .stat span{font-size:11px}
  .catalogue-rayon{padding:6px 9px}
  .suggestion{gap:5px}
  .suggestion .primary{font-size:12px;min-width:78px}
  .data-settings>summary{font-size:16px}
  .settings-row{display:flex;flex-direction:column;align-items:stretch}
  .settings-row button{width:100%;min-height:45px}
  .footer-note{display:none}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px));font-size:12px}
  .modal-backdrop{align-items:flex-end;padding:0}
  .modal{max-height:90dvh;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
}

/* V1.3 — distinction nette entre les achats restants et le panier */
.pending-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:8px}
.pending-head h2{margin:0;font-size:18px;color:#183b35}
.pending-count{background:#164d46;color:#fff;border-radius:999px;font-size:12px;font-weight:850;padding:5px 10px;white-space:nowrap}
.pending-list .item-name{font-weight:850;color:#12292e;font-size:16px}
.pending-list .item{border-top:1px solid #e9eeee;min-height:52px}
.pending-list .check{width:26px;height:26px}
.basket-details{border:1px solid #dce6e5;background:#f5f8f8;border-radius:14px;margin-top:14px;overflow:hidden}
.basket-details>summary{cursor:pointer;list-style:none;padding:13px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:780;color:#2d6260}
.basket-details>summary::-webkit-details-marker{display:none}
.basket-details>summary:after{content:'Afficher';font-size:12px;color:#4c6d6c;font-weight:650}
.basket-details[open]>summary:after{content:'Masquer'}
.basket-content{padding:0 12px 10px;border-top:1px solid #dce6e5}
.basket-content .item-name{font-weight:500;color:#718184;text-decoration:line-through}
.basket-content .item{min-height:47px}
.basket-help{font-size:12px;color:#566a6d;margin:11px 0 4px}
.unplanned-box{margin-top:10px;border:1px solid #cfe7dc;border-radius:14px;background:#f4faf7;padding:12px}
.unplanned-box>summary{cursor:pointer;list-style:none;font-weight:760;color:#185b50}
.unplanned-box>summary::-webkit-details-marker{display:none}
.unplanned-box>summary::before{content:'＋ ';font-weight:850}
.unplanned-form{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px;margin-top:12px;align-items:end}
.unplanned-form button{grid-column:1/-1}
.tag-unplanned{display:inline-block;color:#975a16;background:#fff2dc;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:750;margin-left:5px;text-decoration:none}
.session-meta{margin:0;color:#36645b;font-size:13px}
.remaining-empty{background:#e7f6ef;color:#195d49;border-radius:11px;padding:12px;font-weight:700;font-size:14px}
@media(max-width:640px){.unplanned-form{grid-template-columns:minmax(0,1fr) 105px}.pending-list .item-name{font-size:16px}.session-head{padding:12px}.basket-details>summary{padding:14px 11px}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="eyebrow">Version 1.3</div><h1>Mes courses <span aria-hidden="true">🛒</span></h1><p class="sub">Une liste, cinq enseignes, tes habitudes.</p></div>
    <div class="logo" aria-hidden="true">🧺</div>
  </header>
  <nav aria-label="Navigation principale" id="nav"></nav>
  <main id="main"></main>
  <div class="footer-note">Prototype gratuit et autonome · Données enregistrées uniquement dans ce navigateur · Pense à exporter une sauvegarde</div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='liste-courses-perso-v1';
const STORES=['Aldi','Super U','Carrefour','Grand Frais','Picard'];
const CATEGORIES=['Fruits et légumes','Boucherie / Charcuterie','Poissonnerie','Crèmerie et œufs','Yaourts et desserts frais','Fromages','Traiteur frais et plats préparés','Autres produits frais','Épicerie salée','Épicerie sucrée','Surgelés','Boissons','Hygiène et beauté','Maison et entretien','Animaux','Autres'];
const RULES=[
  ['Fruits et légumes',/banane|pomme|poire|orange|mandarine|cl[eé]mentine|citron|avocat|salade|tomate|carotte|concombre|courgette|oignon|ail|poireau|pomme de terre|patate|champignon|aubergine|fraises?|framboise|cerise|kiwi|melon|past[eè]que|brocoli|chou|courge|fruit|l[eé]gume frais/i],
  ['Surgelés',/surgel|glace|sorbet|po[eê]l[eé]e|nugget|frites surgel|pizza surgel/i],
  ['Épicerie salée',/p[aâ]te|riz|semoule|farine|conserve|lentille|pois chiche|huile|vinaigre|sel|poivre|sauce|pesto|soupe|biscotte|pain|quinoa|couscous/i],
  ['Épicerie sucrée',/caf[eé]|sucre|chocolat|biscuit|confiture|miel|nutella|gateau|g[aâ]teau|compote|c[eé]r[eé]ale|th[eé]|bonbon/i],
  ['Boissons',/eau|jus|soda|coca|limonade|sirop|bi[eè]re|vin|boisson/i],
  ['Hygiène et beauté',/dentifrice|brosse [aà] dent|shampo|savon|gel douche|d[eé]odorant|coton|rasoir|papier toilette|mouchoir|protections?/i],
  ['Maison et entretien',/lessive|adoucissant|liquide vaisselle|pastille lave|nettoyant|eponge|[eé]ponge|sac poubelle|essuie.tout|papier alu|film alimentaire|serpilli[eè]re/i],
  ['Animaux',/croquette|liti[eè]re|p[aâ]t[eé]e chat|p[aâ]t[eé]e chien/i]
];
const emptyState=()=>({products:[],list:[],history:[],session:null,dismissed:{}});
let state;let tab='list';let editing=null;let catalogFilter='';let catalogSort='count';let previewStore='Aldi';let toastTimer=null;let basketOpen=false;
const $=s=>document.querySelector(s);
const safe=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const dateStr=s=>new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
const dateDiff=(older,newer)=>Math.max(0,Math.floor((new Date(newer)-new Date(older))/86400000));
function categoryFor(name){
  const n=norm(name);
  // L'ordre des contrôles évite que « Danette chocolat » passe en épicerie sucrée,
  // ou que « cappelletti au jambon cru » soit confondu avec de la charcuterie.
  if(/surgel|glace|sorbet|pizza surgel/.test(n))return 'Surgelés';
  if(/cappelletti|ravioli|tielle|lasagne|quiche|plat cuisine|plat prepare|poke|w akame|wakam[eé]|salade composee|choucroute cuite|taboule|tofu/.test(n))return 'Traiteur frais et plats préparés';
  if(/saumon|cabillaud|poisson|crevette|truite|thon frais|merlu|sardine|maquereau|colin|fruits de mer/.test(n))return 'Poissonnerie';
  if(/bacon|lardons?|charcuterie|saucisson|chorizo|rillettes|jambon|tranche de dinde|salami|mortadelle|poulet|steak|viande|boeuf|porc|saucisse|merguez|canard|escalope/.test(n))return 'Boucherie / Charcuterie';
  if(/danettes?|yaourts?|yogourts?|skyr|creme dessert|dessert lacte|flan|mousse au chocolat|petits? suisses?|riz au lait|faisselle/.test(n))return 'Yaourts et desserts frais';
  if(/fromage|reblochon|halloumi|roquefort|comte|camembert|brie|chevre|cheddar|mozzarella|ricotta|feta|parmesan|emmental|gruyere|boursin|raclette|societe creme/.test(n))return 'Fromages';
  if(/(^| )oeufs?( |$)|(^| )œufs?( |$)|^lait\b|^beurre\b|creme fraiche|creme epaisse|creme liquide|creme fleurette/.test(n))return 'Crèmerie et œufs';
  if(/refriger|frais|refriger[eé]|pasteurise/.test(n))return 'Autres produits frais';
  return RULES.find(([_,re])=>re.test(n))?.[0]||'Autres';
}
function migrateCategories(obj){
  for(const p of obj.products||[]){
    if(!Array.isArray(p.stores))p.stores=[];
    if(p.category==='Boucherie et poissonnerie'){
      p.category=/saumon|cabillaud|poisson|crevette|truite|thon|merlu|sardine|maquereau|colin/.test(norm(p.name))?'Poissonnerie':'Boucherie / Charcuterie';
    }else if(p.category==='Produits frais'){
      // Les anciennes catégories génériques sont réparties une fois dans les nouveaux rayons.
      const suggested=categoryFor(p.name);
      p.category=['Crèmerie et œufs','Yaourts et desserts frais','Fromages','Traiteur frais et plats préparés'].includes(suggested)?suggested:'Autres produits frais';
    }
  }
  if(obj.session){
    if(!Array.isArray(obj.session.checked))obj.session.checked=[];
    if(!Array.isArray(obj.session.extras))obj.session.extras=[];
    // Une liste issue d'une ancienne version reste utilisable en session.
    obj.session.checked=[...new Set(obj.session.checked)];
  }
  return obj;
}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return emptyState();const obj=JSON.parse(raw);if(!Array.isArray(obj.products)||!Array.isArray(obj.list)||!Array.isArray(obj.history))throw Error('format');return migrateCategories({...emptyState(),...obj})}catch(e){return emptyState()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){notify('Enregistrement local indisponible. Exporte une sauvegarde.');return false}}
function notify(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3300)}
function product(id){return state.products.find(p=>p.id===id)}
function findProduct(name){return state.products.find(p=>norm(p.name)===norm(name))}
function countProduct(id){return state.history.reduce((n,h)=>n+(h.items||[]).filter(i=>i.id===id).length,0)}
function getOrCreate(name){let p=findProduct(name);if(p)return p;p={id:uid(),name:name.trim(),category:categoryFor(name),stores:[],storeMode:'auto',favorite:false};state.products.push(p);return p}
function addItem(name,qty=''){name=String(name||'').trim();qty=String(qty||'').trim();if(!name){notify('Indique le nom du produit.');return false}if(name.length>100||qty.length>80){notify('Le nom ou la quantité est trop long.');return false}const p=getOrCreate(name);if(state.list.some(i=>i.id===p.id)){notify('Déjà dans ta liste.');return false}state.list.push({id:p.id,quantity:qty,addedAt:new Date().toISOString()});save();notify(p.name+' ajouté à la liste.');return true}
function removeItem(id){state.list=state.list.filter(i=>i.id!==id);if(state.session)state.session.checked=state.session.checked.filter(x=>x!==id);save()}
function grouped(items,renderItem){const by={};for(const it of items){const cat=product(it.id)?.category||'Autres';(by[cat]||=[]).push(it)}return CATEGORIES.filter(c=>by[c]?.length).map(c=>`<div class="group-title">${safe(c)}</div>${by[c].map(renderItem).join('')}`).join('')}
function renderNav(){const names=[['list','📝','Liste','Liste'],['store','🛍️','En magasin','Magasin'],['catalog','⭐','Habitudes','Habitudes'],['history','🕘','Historique','Historique']];$('#nav').innerHTML=names.map(([key,icon,full,short])=>`<button type="button" data-action="tab" data-tab="${key}" class="${key===tab?'active':''}" aria-label="${full}" aria-current="${key===tab?'page':'false'}"><span class="nav-icon" aria-hidden="true">${icon}</span><span class="nav-text-desktop">${full}</span><span class="nav-text-mobile">${short}</span></button>`).join('')}
function listRow(it){const p=product(it.id);if(!p)return '';return `<div class="item"><div class="item-body"><div class="item-name">${safe(p.name)}${it.quantity?` <span class="pill">${safe(it.quantity)}</span>`:''}</div><div class="item-sub">${safe(p.category)}</div></div><div class="item-actions"><button class="icon-btn" type="button" title="Modifier ce produit" aria-label="Modifier ${safe(p.name)}" data-action="edit" data-id="${p.id}">✎</button><button class="icon-btn" type="button" title="Retirer de la liste" aria-label="Retirer ${safe(p.name)}" data-action="remove" data-id="${p.id}">×</button></div></div>`}
function suggestions(){const today=new Date();let suggestions=[];for(const p of state.products){if(state.list.some(i=>i.id===p.id))continue;const dates=state.history.filter(h=>(h.items||[]).some(i=>i.id===p.id)).map(h=>new Date(h.at)).filter(d=>!isNaN(d)).sort((a,b)=>a-b);if(dates.length<2)continue;const intervals=[];for(let i=1;i<dates.length;i++){const d=dateDiff(dates[i-1],dates[i]);if(d>=1)intervals.push(d)}if(!intervals.length)continue;const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;const since=dateDiff(dates[dates.length-1],today);if(since<Math.max(2,Math.round(avg*.8)))continue;const dismissed=state.dismissed[p.id];if(dismissed&&dateDiff(dismissed,today)<7)continue;suggestions.push({p,since,avg,score:since/avg})}return suggestions.sort((a,b)=>b.score-a.score).slice(0,5)}
function renderSuggestions(){const suggestionsList=suggestions();if(!suggestionsList.length)return `<div class="card"><div class="section-heading"><h2>✨ Peut-être à acheter</h2></div><div class="empty">Après au moins deux achats d'un même produit à des dates différentes, des suggestions apparaîtront ici. Elles ne seront jamais ajoutées automatiquement.</div></div>`;return `<div class="card"><div class="section-heading"><h2>✨ Peut-être à acheter</h2><span class="pill pill-green">À valider</span></div><p class="micro">Ces propositions se basent sur ton historique. Tu décides pour chaque article.</p>${suggestionsList.map(x=>`<div class="suggestion"><div class="item-body"><div class="item-name">${safe(x.p.name)}</div><div class="item-sub">Habituellement tous les ~${Math.round(x.avg)} j. · Dernier achat il y a ${x.since} j.</div></div><button class="primary" data-action="quickadd" data-id="${x.p.id}">+ Ajouter</button><button class="icon-btn" title="Pas maintenant (7 jours)" data-action="dismiss" data-id="${x.p.id}">×</button></div>`).join('')}</div>`}
function renderList(){const favorite=state.products.filter(p=>p.favorite||countProduct(p.id)>=2).filter(p=>!state.list.some(i=>i.id===p.id)).sort((a,b)=>Number(b.favorite)-Number(a.favorite)||countProduct(b.id)-countProduct(a.id)).slice(0,10);return `<div class="card"><div class="section-heading"><h2>Ajouter un produit</h2><span class="pill">Saisie rapide</span></div><form id="add-form" class="add-grid"><div><label class="field" for="product-name">Produit</label><input class="field-input" id="product-name" name="name" list="known-products" maxlength="100" autocomplete="off" placeholder="Ex. lait, bananes, pâtes" required><datalist id="known-products">${state.products.map(p=>`<option value="${safe(p.name)}"></option>`).join('')}</datalist></div><div><label class="field" for="quantity">Quantité (facultative)</label><input class="field-input" id="quantity" name="quantity" maxlength="80" placeholder="Ex. 6 bouteilles"></div><button type="submit" class="primary add-button">+ Ajouter</button></form>${favorite.length?`<div style="margin-top:16px"><label class="field">Mes produits habituels</label><div class="chips">${favorite.map(p=>`<button class="chip" type="button" data-action="quickadd" data-id="${p.id}">+ ${safe(p.name)}</button>`).join('')}</div></div>`:`<p class="micro guide" style="margin:13px 0 0">Les produits habituels apparaîtront ici après tes achats. Tu peux aussi en marquer comme favoris dans l'onglet « Habitudes ».</p>`}</div><div class="card"><div class="section-heading"><h2>Ma liste globale</h2><span class="pill pill-blue">${state.list.length} produit${state.list.length>1?'s':''}</span></div>${state.list.length?grouped(state.list,listRow):'<div class="empty">Ta liste est vide. Ajoute un premier article ci-dessus : il sera classé automatiquement par rayon.</div>'}<div class="hint guide">Tu prépares une seule liste. Dans « En magasin », tu pourras voir les produits habituels de l’enseigne et les autres séparément.</div></div>${renderSuggestions()}`}
function sessionRow(it,other=false,bought=false){
  const p=product(it.id);if(!p)return '';
  const checked=state.session?.checked.includes(it.id);
  const unexpected=(state.session?.extras||[]).some(x=>x.id===it.id);
  const unknown=!p.stores.length;
  const sub=unexpected?'Achat ajouté sur place':other?`Habituellement : ${p.stores.join(', ')}`:unknown?'Magasin non identifié':p.category;
  return `<div class="item ${checked?'checked':''}"><input class="check" type="checkbox" data-action="check" data-id="${p.id}" ${checked?'checked':''} aria-label="${checked?'Retirer du panier':'Mettre dans le panier'} : ${safe(p.name)}"><div class="item-body"><div class="item-name">${safe(p.name)}${it.quantity?` <span class="pill">${safe(it.quantity)}</span>`:''}${unexpected?'<span class="tag-unplanned">Imprévu</span>':''}</div><div class="item-sub">${safe(sub)}</div></div></div>`;
}

function lastPurchase(id){
  let mostRecent=0;
  for(const h of state.history){
    if((h.items||[]).some(i=>i.id===id)){
      const t=new Date(h.at).getTime();
      if(Number.isFinite(t)&&t>mostRecent)mostRecent=t;
    }
  }
  return mostRecent;
}
function catalogItems(){
  const filtered=state.products.filter(p=>norm(p.name).includes(norm(catalogFilter)));
  const alpha=(a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'});
  const categoryIndex=p=>{const i=CATEGORIES.indexOf(p.category);return i<0?CATEGORIES.length:i};
  return filtered.sort((a,b)=>{
    if(catalogSort==='name')return alpha(a,b);
    if(catalogSort==='recent')return lastPurchase(b.id)-lastPurchase(a.id)||alpha(a,b);
    if(catalogSort==='category')return categoryIndex(a)-categoryIndex(b)||alpha(a,b);
    return countProduct(b.id)-countProduct(a.id)||alpha(a,b);
  });
}

  return `<div class="card"><div class="section-heading"><h2>Mes habitudes</h2><span class="pill pill-green">${state.products.length} produits connus</span></div><div class="two"><div class="stat"><b>${favs}</b><span>habituels ou favoris</span></div><div class="stat"><b>${state.history.length}</b><span>sessions enregistr\u00e9es</span></div></div><div class="hint guide">\u2b50 Ajoute un favori avec l'\u00e9toile. \u270e Corrige son rayon ou ses magasins. Les magasins sont aussi appris \u00e0 la fin des sessions, sauf si tu as fix\u00e9 une s\u00e9lection manuelle.</div></div><div class="card"><div class="section-heading"><h2>Catalogue de produits</h2></div><div class="catalog-controls"><div><label class="field" for="catalog-search">Rechercher un produit</label><input id="catalog-search" type="search" class="field-input" placeholder="Filtrer le catalogue" value="${safe(catalogFilter)}"></div><div><label class="field" for="catalog-sort">Trier par</label><select id="catalog-sort" class="field-input"><option value="count" ${catalogSort==='count'?'selected':''}>Nombre d'achats (d\u00e9croissant)</option><option value="name" ${catalogSort==='name'?'selected':''}>Ordre alphab\u00e9tique (A-Z)</option><option value="recent" ${catalogSort==='recent'?'selected':''}>Achats les plus r\u00e9cents</option><option value="category" ${catalogSort==='category'?'selected':''}>Rayon</option></select></div></div><div id="catalog-results">${catalogRows(items)}</div></div>`;

function catalogRows(items){
  if(!items.length)return '<div class="empty" style="margin-top:12px">Aucun produit ne correspond \u00e0 cette recherche.</div>';
  let lastCategory='';
  return items.map(p=>{
    const n=countProduct(p.id);
    const when=lastPurchase(p.id);
    const heading=catalogSort==='category'&&p.category!==lastCategory?`<div class="group-title catalogue-rayon">${safe(p.category)}</div>`:'';
    lastCategory=p.category;
    return `${heading}<div class="item"><button type="button" class="icon-btn" data-action="favorite" data-id="${p.id}" title="${p.favorite?'Retirer des favoris':'Mettre en favori'}" aria-label="Favori ${safe(p.name)}">${p.favorite?'\u2605':'\u2606'}</button><div class="item-body"><div class="item-name">${safe(p.name)}</div><div class="item-sub">${safe(p.category)} \u00b7 ${p.stores.length?safe(p.stores.join(', ')):'Magasin inconnu'} \u00b7 <strong class="purchase-count">${n} achat${n>1?'s':''}</strong>${when?` <span class="last-purchase">\u00b7 Dernier achat : ${safe(dateStr(when))}</span>`:''}</div></div><div class="item-actions"><button type="button" class="icon-btn" data-action="edit" data-id="${p.id}" title="Corriger">\u270e</button><button type="button" class="ghost" data-action="quickadd" data-id="${p.id}" ${state.list.some(i=>i.id===p.id)?'disabled':''}>+ Ajouter</button></div></div>`;
  }).join('');
}
function renderHistory(){return `<div class="card"><div class="section-heading"><h2>Historique des courses</h2><span class="pill pill-blue">${state.history.length} session${state.history.length>1?'s':''}</span></div>${state.history.length?state.history.slice().reverse().map(h=>`<div class="history-card"><h3>🛍️ ${safe(h.store)} · ${dateStr(h.at)}</h3><p>${h.items.map(i=>safe(i.name)+(i.quantity?' ('+safe(i.quantity)+')':'')+(i.unexpected?' [imprévu]':'')).join(' · ')||'Aucun achat'}</p></div>`).join(''):'<div class="empty">Après une première session terminée, les achats apparaîtront ici. C’est cet historique qui permettra d’apprendre tes habitudes.</div>'}</div><details class="card data-settings"><summary>⚙️ Sauvegardes et données</summary><div class="data-inner"><p class="small">Dans cette première version, les informations restent sur le navigateur et l'appareil où tu utilises ce fichier. Il n'y a pas encore de synchronisation entre ton ordinateur et ton téléphone.</p><div class="settings-row"><button class="secondary" data-action="export">⬇ Exporter une sauvegarde</button><button class="secondary" data-action="import">⬆ Importer une sauvegarde</button><button class="destructive" data-action="reset">Effacer mes données</button></div><input id="import-file" type="file" accept="application/json,.json" style="display:none"><div class="hint">Sauvegarde conseillée : exporte de temps en temps un fichier JSON. Nous pourrons ensuite installer un stockage plus durable, par exemple dans Google Sheets.</div></div></details>`}
function renderModal(){const root=$('#modal-root');if(!editing){root.innerHTML='';return}const p=product(editing);if(!p){editing=null;root.innerHTML='';return}root.innerHTML=`<div class="modal-backdrop" data-action="close-modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Modifier un produit"><h2>Modifier : ${safe(p.name)}</h2><form id="edit-form"><label class="field" for="edit-category">Rayon</label><select class="field-input" id="edit-category" name="category">${CATEGORIES.map(c=>`<option value="${safe(c)}" ${c===p.category?'selected':''}>${safe(c)}</option>`).join('')}</select><div style="margin-top:17px"><label class="field">Magasins habituels (0, 1 ou plusieurs)</label><div class="store-grid">${STORES.map(s=>`<label class="store-check"><input type="checkbox" name="store" value="${safe(s)}" ${p.stores.includes(s)?'checked':''}>${safe(s)}</label>`).join('')}</div></div><label class="store-check"><input name="manual" type="checkbox" ${p.storeMode==='manual'?'checked':''}>Conserver ces magasins comme choix manuel (prioritaire sur l'apprentissage)</label><p class="micro">Si décoché, de nouveaux achats pourront compléter automatiquement cette liste de magasins.</p><div class="session-actions"><button type="submit" class="primary">Enregistrer</button><button type="button" class="secondary" data-action="close-modal">Annuler</button></div></form></div></div>`}

function startSession(){const selected=$('#store-select')?.value||previewStore;previewStore=selected;state.lastStore=selected;state.session={store:selected,checked:[],extras:[],startedAt:new Date().toISOString()};basketOpen=false;save();render()}
function addUnexpected(name,qty=''){
  if(!state.session){notify('Commence une session avant d’ajouter un achat imprévu.');return false}
  name=String(name||'').trim();qty=String(qty||'').trim();
  if(!name||name.length>100||qty.length>80){notify('Vérifie le nom du produit et sa quantité.');return false}
  const p=getOrCreate(name);
  const s=state.session;
  const planned=state.list.some(i=>i.id===p.id);
  const extra=(s.extras||[]).some(i=>i.id===p.id);
  if(!planned&&!extra)s.extras.push({id:p.id,quantity:qty,addedAt:new Date().toISOString()});
  if(!s.checked.includes(p.id))s.checked.push(p.id);
  basketOpen=true;
  save();notify(planned?`${p.name} coché dans ta liste.`:extra?`${p.name} déjà dans ton panier.`:`${p.name} ajouté comme achat imprévu.`);
  return true;
}
function finishSession(){
  if(!state.session)return;
  const s=state.session;
  const checked=s.checked||[];
  if(!checked.length&&!confirm('Aucun article coché. Terminer quand même la session ?'))return;
  const all=[...state.list,...(s.extras||[])];
  const items=checked.map(id=>{
    const p=product(id), i=all.find(it=>it.id===id);
    return p&&i?{id,name:p.name,quantity:i.quantity||'',unexpected:(s.extras||[]).some(x=>x.id===id)}:null;
  }).filter(Boolean);
  for(const it of items){const p=product(it.id);if(p&&p.storeMode!=='manual'&&!p.stores.includes(s.store))p.stores.push(s.store)}
  state.history.push({id:uid(),at:new Date().toISOString(),store:s.store,items});
  state.list=state.list.filter(it=>!checked.includes(it.id));
  state.session=null;basketOpen=false;
  save();tab='list';render();
  const n=items.filter(x=>x.unexpected).length;
  notify(`${items.length} achat${items.length>1?'s':''} enregistré${items.length>1?'s':''}${n?' dont '+n+' imprévu'+(n>1?'s':''):''}.`);
}
function downloadData(){const data=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mes-courses-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('Fichier de sauvegarde créé.')}
async function importData(file){if(!file)return;try{const raw=await file.text();const loaded=JSON.parse(raw);if(!Array.isArray(loaded.products)||!Array.isArray(loaded.list)||!Array.isArray(loaded.history)||loaded.products.length>10000)throw Error('structure');if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;state=migrateCategories({...emptyState(),...loaded,session:null});catalogSort=state.catalogSort||'count';previewStore=STORES.includes(state.lastStore)?state.lastStore:STORES[0];save();tab='list';render();notify('Sauvegarde importée.')}catch(e){notify('Impossible de lire ce fichier de sauvegarde.')}}
document.addEventListener('submit',e=>{if(e.target.id==='add-form'){e.preventDefault();const name=$('#product-name').value;const qty=$('#quantity').value;if(addItem(name,qty)){render();$('#product-name')?.focus()}}if(e.target.id==='unexpected-form'){e.preventDefault();const name=e.target.elements.name.value;const qty=e.target.elements.quantity.value;if(addUnexpected(name,qty)){render()}}if(e.target.id==='edit-form'){e.preventDefault();const p=product(editing);if(!p)return;const form=e.target;p.category=form.elements.category.value;p.categoryMode='manual';p.stores=Array.from(form.querySelectorAll('input[name="store"]:checked')).map(x=>x.value);p.storeMode=form.elements.manual.checked?'manual':'auto';save();editing=null;render();notify('Produit mis à jour.')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;const id=b.dataset.id;if(action==='close-modal-backdrop'&&e.target!==b)return;if(action==='tab'){tab=b.dataset.tab;render();window.scrollTo(0,0)}else if(action==='remove'){const p=product(id);removeItem(id);render();notify((p?.name||'Produit')+' retiré de la liste.')}else if(action==='quickadd'){const p=product(id);if(p){addItem(p.name);render()}}else if(action==='favorite'){const p=product(id);if(p){p.favorite=!p.favorite;save();render()}}else if(action==='edit'){editing=id;renderModal()}else if(action==='close-modal'||action==='close-modal-backdrop'){editing=null;renderModal()}else if(action==='dismiss'){state.dismissed[id]=new Date().toISOString();save();render()}else if(action==='start')startSession();else if(action==='finish')finishSession();else if(action==='cancel'){if(confirm('Annuler la session ? Les articles cochés ne seront pas enregistrés.')){state.session=null;basketOpen=false;save();render()}}else if(action==='export')downloadData();else if(action==='import')$('#import-file')?.click();else if(action==='reset'){if(confirm('EFFACER toutes les listes, habitudes et l’historique de ce navigateur ? Cette action est irréversible sans sauvegarde.')){state=emptyState();save();tab='list';render();notify('Données réinitialisées.')}}});
document.addEventListener('click',e=>{if(e.target.closest('#basket-details > summary'))basketOpen=!basketOpen});
document.addEventListener('change',e=>{if(e.target.dataset.action==='check'){const id=e.target.dataset.id;const arr=state.session?.checked;if(!arr)return;if(e.target.checked&&!arr.includes(id))arr.push(id);if(!e.target.checked)state.session.checked=arr.filter(x=>x!==id);save();render()}if(e.target.id==='import-file'){importData(e.target.files?.[0]);e.target.value=''}if(e.target.id==='catalog-sort'){catalogSort=e.target.value;state.catalogSort=catalogSort;save();$('#catalog-results').innerHTML=catalogRows(catalogItems())}if(e.target.id==='store-select'){previewStore=e.target.value;state.lastStore=previewStore;save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){catalogFilter=e.target.value;$('#catalog-results').innerHTML=catalogRows(catalogItems())}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&editing){editing=null;renderModal()}});
state=load();catalogSort=['count','name','recent','category'].includes(state.catalogSort)?state.catalogSort:'count';previewStore=STORES.includes(state.lastStore)?state.lastStore:STORES[0];render();
})();
</script>
</body>
</html>
