<title>Mes courses — V1.4.2</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#182331;background:#f3f6f7;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}

.shell{max-width:860px;margin:auto;padding:18px 18px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 19px}

.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#d9f3eb;font-size:23px;flex:none}

.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-heading h2{margin:0}
.muted{color:#65777c}
.micro{font-size:12px;color:#66777e;line-height:1.42}
.small{font-size:13px;line-height:1.5;color:#5c7075}

.add-grid{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:end}
.field-input{width:100%;min-height:44px;border-radius:11px;border:1px solid #cfdde0;background:#fff;padding:11px 12px;color:#182331}

.primary:hover{background:#0f5852}
.secondary{border:1px solid #cbd9dc;border-radius:11px;padding:10px 12px;min-height:40px;background:#fff;color:#235d5a;font-weight:700}
.ghost{background:#edf6f3;color:#0e665d;border:0;border-radius:10px;padding:9px 11px;font-weight:700}
.destructive{color:#ae3838;background:#fff;border:1px solid #ebcaca;border-radius:10px;padding:9px 11px;font-weight:700}
.icon-btn{background:transparent;border:0;border-radius:9px;padding:8px;min-width:37px;min-height:37px;font-size:18px;color:#59727a}
.icon-btn:hover{background:#f2f7f6}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid #bcd9d4;color:#125f58;border-radius:999px;background:#f1fbf8;padding:9px 12px;font-size:13px;font-weight:650}
.empty{padding:16px;border:1px dashed #ccd9d9;background:#f8faf9;border-radius:13px;color:#67777b;font-size:13px;line-height:1.6}
.group-title{font-size:13px;letter-spacing:.2px;color:#516a70;font-weight:800;margin:18px 0 6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #edf1f1;min-height:54px}
.item:first-of-type{border-top:0}
.item-body{min-width:0;flex:1}
.item-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.item-sub{font-size:12px;color:#6b7b80;margin-top:3px}
.item-actions{display:flex;gap:2px;flex:none;align-items:center}
.pill{display:inline-block;font-size:11px;font-weight:750;padding:4px 8px;border-radius:999px;background:#eff3f4;color:#5a6b72;white-space:nowrap}
.pill-blue{background:#eaf2fd;color:#235b8c}
.pill-green{background:#e9f7f1;color:#0d6a50}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f0f7f4;border-radius:14px;padding:15px}
.stat b{font-size:24px;color:#174e49;display:block}
.stat span{font-size:12px;color:#5e7479}
.hint{background:#eaf6f4;border-left:3px solid #2e9e92;border-radius:8px;padding:11px 13px;color:#315a58;font-size:13px;line-height:1.5;margin-top:13px}
.check{width:24px;height:24px;accent-color:#176f66;flex:none;cursor:pointer}
.checked .item-name{text-decoration:line-through;color:#718184}
.session-head{background:#e7f5ef;border:1px solid #cce7db;border-radius:14px;padding:13px;margin-bottom:14px}
.session-head b{display:block;color:#185c50}
.session-head p{margin:4px 0 0;color:#4b716a;font-size:12px}
.session-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
hr{border:0;border-top:1px solid #e7eeee;margin:18px 0}
.kicker{font-size:12px;font-weight:800;color:#256d64;letter-spacing:.65px;text-transform:uppercase;margin:0 0 5px}

.all-other{background:#f8f9f9;border-radius:14px;padding:14px;margin-top:12px}
.all-other .group-title:first-child{margin-top:0}
.note{font-size:12px;color:#6b7d82;margin:5px 0 0}
.list-selector{display:flex;gap:9px;align-items:end}
.list-selector>div{flex:1}
.note-box{padding:12px;border-radius:12px;background:#f7f9fa;font-size:13px;color:#536b72;line-height:1.5}
.history-card{padding:12px 0;border-top:1px solid #edf0f0}
.history-card:first-of-type{border-top:0}
.history-card h3{font-size:14px;margin:0 0 6px}
.history-card p{font-size:13px;line-height:1.6;color:#5e6c70;margin:0}
.modal-backdrop{position:fixed;inset:0;background:#142c33a6;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:100%;max-width:540px;background:#fff;border-radius:20px;padding:22px;max-height:90vh;overflow:auto;box-shadow:0 15px 50px #0003}
.modal h2{margin:0 0 16px;font-size:20px}
.store-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0 18px}
.store-check{padding:9px;background:#f7faf9;border:1px solid #e7eeee;border-radius:9px;font-size:13px;display:flex;gap:8px;align-items:center}
.store-check input{accent-color:#1d7066}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1a3940;color:#fff;border-radius:12px;padding:12px 16px;font-size:13px;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 25px #15312f55;display:none}
.toast.show{display:block}
.footer-note{text-align:center;color:#708286;font-size:11px;margin-top:20px;line-height:1.6}
.settings-row{display:flex;flex-wrap:wrap;gap:9px}
.catalog-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,275px);gap:12px;align-items:end;margin-bottom:12px}
.purchase-count{font-weight:850;color:#155c54;background:#e9f6f1;padding:2px 6px;border-radius:6px;white-space:nowrap}

@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease}}

}

/* V1.3 — distinction nette entre les achats restants et le panier */
.pending-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:8px}

.pending-list .item-name{font-weight:850;color:#12292e;font-size:16px}

.basket-help{font-size:12px;color:#566a6d;margin:11px 0 4px}
.unplanned-box{margin-top:10px;border:1px solid #cfe7dc;border-radius:14px;background:#f4faf7;padding:12px}

.session-meta{margin:0;color:#36645b;font-size:13px}

/* V1.4.2 — tickets rapprochés et résumé financier */
.version-mark{font-size:10px;font-weight:850;margin-left:9px;color:#28796e;vertical-align:middle;background:#e4f4ee;padding:4px 7px;border-radius:7px;white-space:nowrap}

<body>
<div class="shell">
  <header>
    <div><div class="eyebrow">Version 1.4.2</div><h1>Mes courses <span aria-hidden="true">🛒</span></h1><span class="version-mark">v1.4.2</span><p class="sub">Une liste, cinq enseignes, tes habitudes.</p></div>
    <div class="logo" aria-hidden="true">🧺</div>
  </header>
  <nav aria-label="Navigation principale" id="nav"></nav>
  <main id="main"></main>
  <div class="footer-note">Prototype gratuit et autonome · Données enregistrées uniquement dans ce navigateur · Pense à exporter une sauvegarde</div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='liste-courses-perso-v1';
const STORES=['Aldi','Super U','Carrefour','Grand Frais','Picard'];
const CATEGORIES=['Fruits et légumes','Boucherie / Charcuterie','Poissonnerie','Crèmerie et œufs','Yaourts et desserts frais','Fromages','Traiteur frais et plats préparés','Autres produits frais','Épicerie salée','Épicerie sucrée','Surgelés','Boissons','Hygiène et beauté','Maison et entretien','Animaux','Autres'];
const RULES=[
  ['Fruits et légumes',/banane|pomme|poire|orange|mandarine|cl[eé]mentine|citron|avocat|salade|tomate|carotte|concombre|courgette|oignon|ail|poireau|pomme de terre|patate|champignon|aubergine|fraises?|framboise|cerise|kiwi|melon|past[eè]que|brocoli|chou|courge|fruit|l[eé]gume frais/i],
  ['Surgelés',/surgel|glace|sorbet|po[eê]l[eé]e|nugget|frites surgel|pizza surgel/i],
  ['Épicerie salée',/p[aâ]te|riz|semoule|farine|conserve|lentille|pois chiche|huile|vinaigre|sel|poivre|sauce|pesto|soupe|biscotte|pain|quinoa|couscous/i],
  ['Épicerie sucrée',/caf[eé]|sucre|chocolat|biscuit|confiture|miel|nutella|gateau|g[aâ]teau|compote|c[eé]r[eé]ale|th[eé]|bonbon/i],
  ['Boissons',/eau|jus|soda|coca|limonade|sirop|bi[eè]re|vin|boisson/i],

  ['Maison et entretien',/lessive|adoucissant|liquide vaisselle|pastille lave|nettoyant|eponge|[eé]ponge|sac poubelle|essuie.tout|papier alu|film alimentaire|serpilli[eè]re/i],
  ['Animaux',/croquette|liti[eè]re|p[aâ]t[eé]e chat|p[aâ]t[eé]e chien/i]

const emptyState=()=>({products:[],list:[],history:[],session:null,dismissed:{},receipts:[],receiptAliases:{},receiptDraft:null,receiptEdit:null});

const safe=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dateDiff=(older,newer)=>Math.max(0,Math.floor((new Date(newer)-new Date(older))/86400000));
function categoryFor(name){
  const n=norm(name);
  // L'ordre des contrôles évite que « Danette chocolat » passe en épicerie sucrée,
  // ou que « cappelletti au jambon cru » soit confondu avec de la charcuterie.
  if(/surgel|glace|sorbet|pizza surgel/.test(n))return 'Surgelés';
  if(/cappelletti|ravioli|tielle|lasagne|quiche|plat cuisine|plat prepare|poke|w akame|wakam[eé]|salade composee|choucroute cuite|taboule|tofu/.test(n))return 'Traiteur frais et plats préparés';
  if(/saumon|cabillaud|poisson|crevette|truite|thon frais|merlu|sardine|maquereau|colin|fruits de mer/.test(n))return 'Poissonnerie';
  if(/bacon|lardons?|charcuterie|saucisson|chorizo|rillettes|jambon|tranche de dinde|salami|mortadelle|poulet|steak|viande|boeuf|porc|saucisse|merguez|canard|escalope/.test(n))return 'Boucherie / Charcuterie';
  if(/danettes?|yaourts?|yogourts?|skyr|creme dessert|dessert lacte|flan|mousse au chocolat|petits? suisses?|riz au lait|faisselle/.test(n))return 'Yaourts et desserts frais';
  if(/fromage|reblochon|halloumi|roquefort|comte|camembert|brie|chevre|cheddar|mozzarella|ricotta|feta|parmesan|emmental|gruyere|boursin|raclette|societe creme/.test(n))return 'Fromages';
  if(/(^| )oeufs?( |$)|(^| )œufs?( |$)|^lait\b|^beurre\b|creme fraiche|creme epaisse|creme liquide|creme fleurette/.test(n))return 'Crèmerie et œufs';
  if(/refriger|frais|refriger[eé]|pasteurise/.test(n))return 'Autres produits frais';
  return RULES.find(([_,re])=>re.test(n))?.[0]||'Autres';
}
function migrateCategories(obj){
  for(const p of obj.products||[]){
    if(!Array.isArray(p.stores))p.stores=[];
    if(p.category==='Boucherie et poissonnerie'){
      p.category=/saumon|cabillaud|poisson|crevette|truite|thon|merlu|sardine|maquereau|colin/.test(norm(p.name))?'Poissonnerie':'Boucherie / Charcuterie';
    }else if(p.category==='Produits frais'){
      // Les anciennes catégories génériques sont réparties une fois dans les nouveaux rayons.
      const suggested=categoryFor(p.name);
      p.category=['Crèmerie et œufs','Yaourts et desserts frais','Fromages','Traiteur frais et plats préparés'].includes(suggested)?suggested:'Autres produits frais';
    }
  }
  if(!Array.isArray(obj.receipts))obj.receipts=[];
  if(!obj.receiptAliases||typeof obj.receiptAliases!=='object'||Array.isArray(obj.receiptAliases))obj.receiptAliases={};
  if(!obj.receiptDraft||!Array.isArray(obj.receiptDraft.lines))obj.receiptDraft=null;
  if(!obj.receiptEdit||!Array.isArray(obj.receiptEdit.lines))obj.receiptEdit=null;
  if(obj.session){
    if(!Array.isArray(obj.session.checked))obj.session.checked=[];
    if(!Array.isArray(obj.session.extras))obj.session.extras=[];
    // Une liste issue d'une ancienne version reste utilisable en session.
    obj.session.checked=[...new Set(obj.session.checked)];
  }
  return obj;
}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return emptyState();const obj=JSON.parse(raw);if(!Array.isArray(obj.products)||!Array.isArray(obj.list)||!Array.isArray(obj.history))throw Error('format');return migrateCategories({...emptyState(),...obj})}catch(e){return emptyState()}}

function suggestions(){const today=new Date();let suggestions=[];for(const p of state.products){if(state.list.some(i=>i.id===p.id))continue;const dates=state.history.filter(h=>!h.dateUnknown&&(h.items||[]).some(i=>i.id===p.id)).map(h=>new Date(h.at)).filter(d=>!isNaN(d)).sort((a,b)=>a-b);if(dates.length<2)continue;const intervals=[];for(let i=1;i<dates.length;i++){const d=dateDiff(dates[i-1],dates[i]);if(d>=1)intervals.push(d)}if(!intervals.length)continue;const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;const since=dateDiff(dates[dates.length-1],today);if(since<Math.max(2,Math.round(avg*.8)))continue;const dismissed=state.dismissed[p.id];if(dismissed&&dateDiff(dismissed,today)<7)continue;suggestions.push({p,since,avg,score:since/avg})}return suggestions.sort((a,b)=>b.score-a.score).slice(0,5)}
function renderSuggestions(){const suggestionsList=suggestions();if(!suggestionsList.length)return `<div class="card"><div class="section-heading"><h2>✨ Peut-être à acheter</h2></div><div class="empty">Après au moins deux achats d'un même produit à des dates différentes, des suggestions apparaîtront ici. Elles ne seront jamais ajoutées automatiquement.</div></div>`;return `<div class="card"><div class="section-heading"><h2>✨ Peut-être à acheter</h2><span class="pill pill-green">À valider</span></div><p class="micro">Ces propositions se basent sur ton historique. Tu décides pour chaque article.</p>${suggestionsList.map(x=>`<div class="suggestion"><div class="item-body"><div class="item-name">${safe(x.p.name)}</div><div class="item-sub">Habituellement tous les ~${Math.round(x.avg)} j. · Dernier achat il y a ${x.since} j.</div></div><button class="primary" data-action="quickadd" data-id="${x.p.id}">+ Ajouter</button><button class="icon-btn" title="Pas maintenant (7 jours)" data-action="dismiss" data-id="${x.p.id}">×</button></div>`).join('')}</div>`}
function renderList(){const favorite=state.products.filter(p=>p.favorite||countProduct(p.id)>=2).filter(p=>!state.list.some(i=>i.id===p.id)).sort((a,b)=>Number(b.favorite)-Number(a.favorite)||countProduct(b.id)-countProduct(a.id)).slice(0,10);return `<div class="card"><div class="section-heading"><h2>Ajouter un produit</h2><span class="pill">Saisie rapide</span></div><form id="add-form" class="add-grid"><div><label class="field" for="product-name">Produit</label><input class="field-input" id="product-name" name="name" list="known-products" maxlength="100" autocomplete="off" placeholder="Ex. lait, bananes, pâtes" required><datalist id="known-products">${state.products.map(p=>`<option value="${safe(p.name)}"></option>`).join('')}</datalist></div><div><label class="field" for="quantity">Quantité (facultative)</label><input class="field-input" id="quantity" name="quantity" maxlength="80" placeholder="Ex. 6 bouteilles"></div><button type="submit" class="primary add-button">+ Ajouter</button></form>${favorite.length?`<div style="margin-top:16px"><label class="field">Mes produits habituels</label><div class="chips">${favorite.map(p=>`<button class="chip" type="button" data-action="quickadd" data-id="${p.id}">+ ${safe(p.name)}</button>`).join('')}</div></div>`:`<p class="micro guide" style="margin:13px 0 0">Les produits habituels apparaîtront ici après tes achats. Tu peux aussi en marquer comme favoris dans l'onglet « Habitudes ».</p>`}</div><div class="card"><div class="section-heading"><h2>Ma liste globale</h2><span class="pill pill-blue">${state.list.length} produit${state.list.length>1?'s':''}</span></div>${state.list.length?grouped(state.list,listRow):'<div class="empty">Ta liste est vide. Ajoute un premier article ci-dessus : il sera classé automatiquement par rayon.</div>'}<div class="hint guide">Tu prépares une seule liste. Dans « En magasin », tu pourras voir les produits habituels de l’enseigne et les autres séparément.</div></div>${renderSuggestions()}`}
function sessionRow(it,other=false,bought=false){

function lastPurchase(id){
  let mostRecent=0;
  for(const h of state.history){
    if(!h.dateUnknown&&(h.items||[]).some(i=>i.id===id)){
      const t=new Date(h.at).getTime();
      if(Number.isFinite(t)&&t>mostRecent)mostRecent=t;
    }
  }
  return mostRecent;
}
function catalogItems(){
  const filtered=state.products.filter(p=>norm(p.name).includes(norm(catalogFilter)));
  const alpha=(a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'});
  const categoryIndex=p=>{const i=CATEGORIES.indexOf(p.category);return i<0?CATEGORIES.length:i};
  return filtered.sort((a,b)=>{
    if(catalogSort==='name')return alpha(a,b);
    if(catalogSort==='recent')return lastPurchase(b.id)-lastPurchase(a.id)||alpha(a,b);
    if(catalogSort==='category')return categoryIndex(a)-categoryIndex(b)||alpha(a,b);
    return countProduct(b.id)-countProduct(a.id)||alpha(a,b);
  });
}
function renderCatalog(){

function catalogRows(items){
  if(!items.length)return '<div class="empty" style="margin-top:12px">Aucun produit ne correspond \u00e0 cette recherche.</div>';
  let lastCategory='';
  return items.map(p=>{
    const n=countProduct(p.id);
    const when=lastPurchase(p.id);
    const heading=catalogSort==='category'&&p.category!==lastCategory?`<div class="group-title catalogue-rayon">${safe(p.category)}</div>`:'';
    lastCategory=p.category;
    return `${heading}<div class="item"><button type="button" class="icon-btn" data-action="favorite" data-id="${p.id}" title="${p.favorite?'Retirer des favoris':'Mettre en favori'}" aria-label="Favori ${safe(p.name)}">${p.favorite?'\u2605':'\u2606'}</button><div class="item-body"><div class="item-name">${safe(p.name)}</div><div class="item-sub">${safe(p.category)} \u00b7 ${p.stores.length?safe(p.stores.join(', ')):'Magasin inconnu'} \u00b7 <strong class="purchase-count">${n} achat${n>1?'s':''}</strong>${when?` <span class="last-purchase">\u00b7 Dernier achat : ${safe(dateStr(when))}</span>`:''}</div></div><div class="item-actions"><button type="button" class="icon-btn" data-action="edit" data-id="${p.id}" title="Corriger">\u270e</button><button type="button" class="ghost" data-action="quickadd" data-id="${p.id}" ${state.list.some(i=>i.id===p.id)?'disabled':''}>+ Ajouter</button></div></div>`;
  }).join('');
}

function receiptForHistory(h){return (state.receipts||[]).find(r=>r.sessionId===h.id)||null}
function ensureReceiptBase(r){
  if(Array.isArray(r.baseItems))return r.baseItems;
  const h=state.history.find(s=>s.id===r.sessionId);
  // Historical V1.4.1 added products carry viaReceipt=true. The original
  // manually checked items do not: recover them without mutating the session.
  r.baseItems=(h?.items||[]).filter(it=>!it.viaReceipt).map(it=>({...it}));
  return r.baseItems;
}
function rebuildReceiptAliases(){
  const aliases={};
  for(const r of state.receipts){
    for(const l of r.lines){
      if(l.productId&&product(l.productId))aliases[`${r.store}|${norm(l.rawName)}`]=l.productId;
    }
  }
  state.receiptAliases=aliases;
}
function reconcileReceiptLines(r,editedLines){
  const h=state.history.find(s=>s.id===r.sessionId);
  if(!h)throw Error('Session introuvable : aucune donnée modifiée.');
  const base=ensureReceiptBase(r);
  const baseIds=new Set(base.map(it=>it.id));
  const mapped=new Map();
  const newLines=[];
  for(const line of editedLines){
    const clean=String(line.matchName||'').trim().slice(0,100);
    const p=clean?getOrCreate(clean):null;
    if(p){
      if(p.storeMode!=='manual'&&!p.stores.includes(r.store))p.stores.push(r.store);
      if(!mapped.has(p.id))mapped.set(p.id,p);
    }
    newLines.push({...line,matchName:clean,productId:p?.id||null});
  }
  const newItems=[...mapped.values()].filter(p=>!baseIds.has(p.id)).map(p=>({
    id:p.id,name:p.name,quantity:'',unexpected:false,viaReceipt:true
  }));
  h.items=[...base.map(it=>({...it})),...newItems];
  h.receiptId=r.id;
  r.lines=newLines;
  r.reconciliation={
    matched:[...mapped.keys()].filter(id=>baseIds.has(id)).length,
    newFromTicket:newItems.length,
    notOnReceipt:base.filter(it=>!mapped.has(it.id)).map(it=>({id:it.id,name:product(it.id)?.name||it.name}))
  };
  rebuildReceiptAliases();
  return {matched:r.reconciliation.matched,complementary:newItems.length,notOnReceipt:r.reconciliation.notOnReceipt.length};
}

function receiptCheckedSuggestions(r,line){
  const src=ensureReceiptBase(r).map(it=>product(it.id)).filter(Boolean);
  const stem=t=>t.endsWith('s')&&t.length>3?t.slice(0,-1):t;
  const words=t=>norm(t).split(/[^a-z0-9]+/).filter(x=>x.length>2&&!['des','les','avec','aux','pour','bio','une','sur'].includes(x)).map(stem);
  const phrase=words(line.matchName).join(' ');
  return src.map(p=>{
    const candidate=words(p.name).join(' ');
    // An exact or whole-word prefix is safe to PROPOSE. Overlapping generic
    // ingredients alone (e.g. "chocolat noir") are too ambiguous.
    const plausible=phrase&&candidate&&(phrase===candidate||phrase.startsWith(candidate+' ')||candidate.startsWith(phrase+' '));
    return {p,score:plausible?candidate.length:0};
  }).filter(o=>o.score>0&&norm(o.p.name)!==norm(line.matchName))
    .sort((a,b)=>b.score-a.score).slice(0,2).map(o=>o.p);
}

function receiptSuggestions(d){
  for(const line of d.lines){
    const aliasId=state.receiptAliases[`${d.store}|${norm(line.rawName)}`];
    const aliasProduct=product(aliasId);
    if(aliasProduct)line.matchName=aliasProduct.name;
    else if(!line.matchName)line.matchName=line.suggestedName||line.rawName;
  }
}
function normalizeReceipt(raw){
  if(!raw||raw.schema!=='mes-courses-ticket-v1'||!STORES.includes(raw.store)||typeof raw.id!=='string'||raw.id.length>120||!Array.isArray(raw.lines)||raw.lines.length<1||raw.lines.length>250||!Number.isSafeInteger(raw.totalCents)||raw.totalCents<0||raw.totalCents>10000000)throw Error('format');
  const lines=raw.lines.map((line,i)=>{
    if(!line||typeof line.rawName!=='string'||line.rawName.length>180||!Number.isSafeInteger(line.amountCents)||line.amountCents<0||line.amountCents>2000000)throw Error('ligne');
    return {line:Number.isInteger(line.line)?line.line:i+1,rawName:line.rawName.trim(),suggestedName:String(line.suggestedName||'').slice(0,100),matchName:String(line.suggestedName||'').slice(0,100),quantity:String(line.quantity||'').slice(0,80),units:Number.isInteger(line.units)?line.units:1,amountCents:line.amountCents,confidence:line.confidence==='to-confirm'?'to-confirm':'high'};
  });
  if(lines.reduce((n,l)=>n+l.amountCents,0)!==raw.totalCents)throw Error('montants');
  return {id:raw.id,store:raw.store,storeDetails:String(raw.storeDetails||'').slice(0,80),purchaseDate:/^\d{4}-\d{2}-\d{2}$/.test(raw.purchaseDate||'')?raw.purchaseDate:'',totalCents:raw.totalCents,articleCount:Number.isInteger(raw.articleCount)?raw.articleCount:null,lines,attachId:''};
}
async function importReceipt(file){
  if(!file)return;
  if(file.size>2000000){notify('Fichier trop volumineux (maximum 2 Mo).');return}
  try{
    const raw=JSON.parse(await file.text());
    const d=normalizeReceipt(raw);
    if(state.receipts.some(r=>r.id===d.id)){notify('Ce ticket est déjà enregistré : aucun doublon ajouté.');return}
    if(state.receiptDraft&&!confirm('Un ticket est déjà en préparation. Le remplacer ?'))return;
    receiptSuggestions(d);
    state.receiptDraft=d;save();tab='history';render();window.scrollTo(0,0);
    notify('Ticket prêt à rapprocher : aucune donnée d’achat modifiée.');
  }catch(e){notify(e.message==='montants'?'Le total ne correspond pas à la somme des lignes.':'Format de ticket non reconnu. Utilise le fichier de ticket préparé pour Mes Courses.')}
}

function finishReceipt(){
  const d=state.receiptDraft;if(!d)return;
  if(state.receipts.some(r=>r.id===d.id)){notify('Ce ticket a déjà été intégré.');return}
  const target=d.attachId?state.history.find(h=>h.id===d.attachId&&h.store===d.store):null;
  if(d.attachId&&!target){notify('La session sélectionnée est introuvable.');return}
  if(target&&target.receiptId){notify('Cette session a déjà un ticket associé.');return}
  const hasDate=/^\d{4}-\d{2}-\d{2}$/.test(d.purchaseDate);
  if(!target&&!hasDate&&!confirm('La date du ticket n’est pas connue. Créer une session sans date ? Les achats seront comptés, mais pas utilisés pour calculer les intervalles entre achats.'))return;
  if(!confirm(`Valider ${d.lines.length} lignes pour ${money(d.totalCents)} ? Tu pourras corriger les correspondances ensuite, sans réimporter le ticket.`))return;
  let h=target;
  if(!h){
    h={id:uid(),at:hasDate?new Date(d.purchaseDate+'T12:00:00').toISOString():null,store:d.store,dateUnknown:!hasDate,items:[]};
    state.history.push(h);

  const r={id:d.id,store:d.store,storeDetails:d.storeDetails,at:h.at,dateUnknown:!!h.dateUnknown,

  state.receipts.push(r);

  </div>${renderReceiptModule()}${renderReceiptEditor()}
  <details class="card data-settings"><summary>⚙️ Sauvegardes et données · v1.4.2</summary><div class="data-inner"><p class="small">Tes listes, tickets et rapprochements sont enregistrés uniquement dans ce navigateur. Aucun partage automatique avec ton ordinateur.</p><div class="settings-row"><button class="secondary" data-action="export">⬇ Exporter une sauvegarde</button><button class="secondary" data-action="import">⬆ Importer une sauvegarde</button><button class="destructive" data-action="reset">Effacer mes données</button></div><input id="import-file" type="file" accept="application/json,.json" style="display:none"><div class="hint">La sauvegarde inclut les tickets, leurs corrections, les achats cochés et les correspondances apprises. Chaque export a un nom unique.</div></div></details>`}

function renderModal(){const root=$('#modal-root');if(!editing){root.innerHTML='';return}const p=product(editing);if(!p){editing=null;root.innerHTML='';return}root.innerHTML=`<div class="modal-backdrop" data-action="close-modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Modifier un produit"><h2>Modifier : ${safe(p.name)}</h2><form id="edit-form"><label class="field" for="edit-category">Rayon</label><select class="field-input" id="edit-category" name="category">${CATEGORIES.map(c=>`<option value="${safe(c)}" ${c===p.category?'selected':''}>${safe(c)}</option>`).join('')}</select><div style="margin-top:17px"><label class="field">Magasins habituels (0, 1 ou plusieurs)</label><div class="store-grid">${STORES.map(s=>`<label class="store-check"><input type="checkbox" name="store" value="${safe(s)}" ${p.stores.includes(s)?'checked':''}>${safe(s)}</label>`).join('')}</div></div><label class="store-check"><input name="manual" type="checkbox" ${p.storeMode==='manual'?'checked':''}>Conserver ces magasins comme choix manuel (prioritaire sur l'apprentissage)</label><p class="micro">Si décoché, de nouveaux achats pourront compléter automatiquement cette liste de magasins.</p><div class="session-actions"><button type="submit" class="primary">Enregistrer</button><button type="button" class="secondary" data-action="close-modal">Annuler</button></div></form></div></div>`}
function render(){renderNav();$('#main').innerHTML=tab==='list'?renderList():tab==='store'?renderStore():tab==='catalog'?renderCatalog():renderHistory();renderModal()}
function startSession(){const selected=$('#store-select')?.value||previewStore;previewStore=selected;state.lastStore=selected;state.session={store:selected,checked:[],extras:[],startedAt:new Date().toISOString()};basketOpen=false;save();render()}
function addUnexpected(name,qty=''){
  if(!state.session){notify('Commence une session avant d’ajouter un achat imprévu.');return false}
  name=String(name||'').trim();qty=String(qty||'').trim();
  if(!name||name.length>100||qty.length>80){notify('Vérifie le nom du produit et sa quantité.');return false}
  const p=getOrCreate(name);
  const s=state.session;
  const planned=state.list.some(i=>i.id===p.id);
  const extra=(s.extras||[]).some(i=>i.id===p.id);
  if(!planned&&!extra)s.extras.push({id:p.id,quantity:qty,addedAt:new Date().toISOString()});
  if(!s.checked.includes(p.id))s.checked.push(p.id);
  basketOpen=true;
  save();notify(planned?`${p.name} coché dans ta liste.`:extra?`${p.name} déjà dans ton panier.`:`${p.name} ajouté comme achat imprévu.`);
  return true;
}
function finishSession(){
  if(!state.session)return;
  const s=state.session;
  const checked=s.checked||[];
  if(!checked.length&&!confirm('Aucun article coché. Terminer quand même la session ?'))return;
  const all=[...state.list,...(s.extras||[])];
  const items=checked.map(id=>{
    const p=product(id), i=all.find(it=>it.id===id);
    return p&&i?{id,name:p.name,quantity:i.quantity||'',unexpected:(s.extras||[]).some(x=>x.id===id)}:null;
  }).filter(Boolean);
  for(const it of items){const p=product(it.id);if(p&&p.storeMode!=='manual'&&!p.stores.includes(s.store))p.stores.push(s.store)}
  state.history.push({id:uid(),at:new Date().toISOString(),store:s.store,items});
  state.list=state.list.filter(it=>!checked.includes(it.id));
  state.session=null;basketOpen=false;
  save();tab='list';render();
  const n=items.filter(x=>x.unexpected).length;
  notify(`${items.length} achat${items.length>1?'s':''} enregistré${items.length>1?'s':''}${n?' dont '+n+' imprévu'+(n>1?'s':''):''}.`);
}
function uniqueBackupFilename(at){
  const pad=n=>String(n).padStart(2,'0');
  const ms=String(at.getMilliseconds()).padStart(3,'0');
  const date=[at.getFullYear(),pad(at.getMonth()+1),pad(at.getDate())].join('-');
  const time=[pad(at.getHours()),pad(at.getMinutes()),pad(at.getSeconds())].join('-');
  return `mes-courses-sauvegarde_${date}_${time}-${ms}.json`;
}
function downloadData(){
  const at=new Date();
  const data=JSON.stringify({...state,exportedAt:at.toISOString()},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=uniqueBackupFilename(at);
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  notify('Sauvegarde pr\u00e9par\u00e9e : ' + a.download);
}
async function importData(file){if(!file)return;try{const raw=await file.text();const loaded=JSON.parse(raw);if(!Array.isArray(loaded.products)||!Array.isArray(loaded.list)||!Array.isArray(loaded.history)||loaded.products.length>10000)throw Error('structure');if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;state=migrateCategories({...emptyState(),...loaded});if(state.session){
      const itemIds=new Set([...state.list,...state.session.extras].map(it=>it.id));
      const productIds=new Set(state.products.map(p=>p.id));
      if(!STORES.includes(state.session.store)||!Array.isArray(state.session.checked)||!Array.isArray(state.session.extras))state.session=null;
      else state.session.checked=state.session.checked.filter(id=>itemIds.has(id)&&productIds.has(id));
    }
    catalogSort=state.catalogSort||'count';previewStore=STORES.includes(state.lastStore)?state.lastStore:STORES[0];save();tab='list';render();notify('Sauvegarde importée.')}catch(e){notify('Impossible de lire ce fichier de sauvegarde.')}}
document.addEventListener('submit',e=>{if(e.target.id==='add-form'){e.preventDefault();const name=$('#product-name').value;const qty=$('#quantity').value;if(addItem(name,qty)){render();$('#product-name')?.focus()}}if(e.target.id==='unexpected-form'){e.preventDefault();const name=e.target.elements.name.value;const qty=e.target.elements.quantity.value;if(addUnexpected(name,qty)){render()}}if(e.target.id==='edit-form'){e.preventDefault();const p=product(editing);if(!p)return;const form=e.target;p.category=form.elements.category.value;p.categoryMode='manual';p.stores=Array.from(form.querySelectorAll('input[name="store"]:checked')).map(x=>x.value);p.storeMode=form.elements.manual.checked?'manual':'auto';save();editing=null;render();notify('Produit mis à jour.')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;const id=b.dataset.id;if(action==='close-modal-backdrop'&&e.target!==b)return;if(action==='tab'){tab=b.dataset.tab;render();window.scrollTo(0,0)}else if(action==='remove'){const p=product(id);removeItem(id);render();notify((p?.name||'Produit')+' retiré de la liste.')}else if(action==='quickadd'){const p=product(id);if(p){addItem(p.name);render()}}else if(action==='favorite'){const p=product(id);if(p){p.favorite=!p.favorite;save();render()}}else if(action==='edit'){editing=id;renderModal()}else if(action==='close-modal'||action==='close-modal-backdrop'){editing=null;renderModal()}else if(action==='dismiss'){state.dismissed[id]=new Date().toISOString();save();render()}else if(action==='start')startSession();else if(action==='finish')finishSession();else if(action==='cancel'){if(confirm('Annuler définitivement cette session ?\n\nLes produits cochés ET les achats imprévus ajoutés sur place seront abandonnés.\n\nChoisis Annuler pour conserver la session.')){state.session=null;basketOpen=false;save();render()}}else if(action==='receipt-edit-open')startReceiptCorrection(id);else if(action==='receipt-edit-suggest'){const i=Number(b.dataset.index);const line=state.receiptEdit?.lines[i];if(line){line.matchName=b.dataset.name;const input=document.getElementById('edit-match-'+i);if(input)input.value=line.matchName;b.textContent='✓ '+line.matchName;refreshReceiptEditStats();save();notify('Correspondance proposée. Valide en bas pour l’enregistrer.')}}else if(action==='receipt-edit-save')finishReceiptCorrection();else if(action==='receipt-edit-cancel'){if(confirm('Abandonner les modifications en cours ? Le ticket enregistré restera inchangé.')){state.receiptEdit=null;save();render()}}else if(action==='receipt-import')$('#receipt-file')?.click();else if(action==='receipt-validate')finishReceipt();else if(action==='receipt-abandon'){if(confirm('Abandonner ce ticket en préparation ? Tes sessions de courses ne seront pas modifiées.')){state.receiptDraft=null;save();render()}}else if(action==='export')downloadData();else if(action==='import')$('#import-file')?.click();else if(action==='reset'){if(confirm('EFFACER toutes les listes, habitudes et l’historique de ce navigateur ? Cette action est irréversible sans sauvegarde.')){state=emptyState();save();tab='list';render();notify('Données réinitialisées.')}}});
document.addEventListener('click',e=>{if(e.target.closest('#basket-details > summary'))basketOpen=!basketOpen});
document.addEventListener('change',e=>{if(e.target.dataset.action==='check'){const id=e.target.dataset.id;const arr=state.session?.checked;if(!arr)return;if(e.target.checked&&!arr.includes(id))arr.push(id);if(!e.target.checked)state.session.checked=arr.filter(x=>x!==id);save();render()}if(e.target.id==='import-file'){importData(e.target.files?.[0]);e.target.value=''}if(e.target.id==='receipt-file'){importReceipt(e.target.files?.[0]);e.target.value=''}if(e.target.id==='receipt-session-target'&&state.receiptDraft){state.receiptDraft.attachId=e.target.value;save();render()}if(e.target.id==='receipt-date'&&state.receiptDraft){state.receiptDraft.purchaseDate=e.target.value;save()}if(e.target.id==='catalog-sort'){catalogSort=e.target.value;state.catalogSort=catalogSort;save();$('#catalog-results').innerHTML=catalogRows(catalogItems())}if(e.target.id==='store-select'){previewStore=e.target.value;state.lastStore=previewStore;save();render()}});
document.addEventListener('input',e=>{if(e.target.dataset.editIndex!==undefined&&state.receiptEdit){const line=state.receiptEdit.lines[Number(e.target.dataset.editIndex)];if(line){line.matchName=e.target.value;refreshReceiptEditStats();save()}}if(e.target.dataset.receiptIndex!==undefined&&state.receiptDraft){const line=state.receiptDraft.lines[Number(e.target.dataset.receiptIndex)];if(line){line.matchName=e.target.value;save()}}if(e.target.id==='catalog-search'){catalogFilter=e.target.value;$('#catalog-results').innerHTML=catalogRows(catalogItems())}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&editing){editing=null;renderModal()}});
state=load();catalogSort=['count','name','recent','category'].includes(state.catalogSort)?state.catalogSort:'count';previewStore=STORES.includes(state.lastStore)?state.lastStore:STORES[0];render();
})();
</script>
